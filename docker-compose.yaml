services:
  nginx-a:
    image: nginx:alpine
    container_name: nginx-a
    networks:
      - az-a
    command: >
      /bin/sh -c 'echo "Container Hostname: $${HOSTNAME}" > /usr/share/nginx/html/index.html && nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx-b:
    image: nginx:alpine
    container_name: nginx-b
    networks:
      - az-b
    command: >
      /bin/sh -c 'echo "Container Hostname: $${HOSTNAME}" > /usr/share/nginx/html/index.html && nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - az-a
      - az-b
    depends_on:
      nginx-a:
        condition: service_healthy
      nginx-b:
        condition: service_healthy

networks:
  az-a:
    driver: bridge
  az-b:
    driver: bridge
