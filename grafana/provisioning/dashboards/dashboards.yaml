# Loads every dashboard JSON in /var/lib/grafana/dashboards at startup.
# Installed to /etc/grafana/provisioning/dashboards/ by scripts/install-grafana.sh.
apiVersion: 1

providers:
  - name: assignment6
    folder: Assignment 6
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
