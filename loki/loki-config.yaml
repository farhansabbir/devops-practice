# Loki, single binary ("monolithic") mode with local filesystem storage.
# Installed to /etc/loki/loki-config.yaml by scripts/install-loki.sh.

# No multi-tenancy. Loki has no authentication of its own, so it listens on
# 127.0.0.1 only: Grafana and Alloy run on the same machine.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Keep a week of logs; the compactor deletes older chunks.
limits_config:
  retention_period: 168h

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
